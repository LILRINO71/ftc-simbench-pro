name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the real 773-part robot is parsed and cloned per test; two such files at once
      # outgrow Node's default heap on the runner (it has 16 GB)
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run build:ship
