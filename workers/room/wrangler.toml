# The match rooms (workers/room/room.js). Deploy once with
#   npx wrangler deploy --config workers/room/wrangler.toml
# then bind it to the Pages project as ROOMS (DEPLOY.md, "Online rooms").
name = "ftc-simbench-rooms"
main = "index.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "BOARDS"
class_name = "BoardDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# the shared leaderboard (workers/room/board.js), bound to the Pages project as BOARDS
[[migrations]]
tag = "v2"
new_sqlite_classes = ["BoardDO"]
